spring:
  application:
    name: condo-backend
  profiles:
    default: dev
  datasource:
    # File-based H2 in PostgreSQL compatibility mode so the Flyway scripts stay portable.
    url: jdbc:h2:file:./data/condo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  web:
    # Fallback when the client sends no Accept-Language (validation messages are localized).
    locale: en
  servlet:
    multipart:
      # Issue photos: 10 MB each (one file per request).
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). MUST be overridden outside dev via APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
    issuer: condo-app
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: http://localhost:4200,http://localhost:8081,http://localhost:19006
  links:
    web-base-url: ${APP_WEB_BASE_URL:http://localhost:4200}
    app-scheme: buildingapp
  invitations:
    max-failed-lookups: 10
    lookup-window: 15m
  storage:
    local-dir: ${APP_STORAGE_DIR:./uploads}
  issues:
    # Issues in REPORTED longer than this are highlighted on the dashboard.
    stuck-after: 48h
  notifications:
    # Deliver notifications on a background executor so requests never wait for push delivery.
    async: true
  push:
    # Off by default: notifications are still stored in-app, pushes are only logged.
    enabled: ${APP_PUSH_ENABLED:false}
    expo-url: https://exp.host/--/api/v2/push/send
    access-token: ${APP_PUSH_ACCESS_TOKEN:}
  memberships:
    # Flips ACTIVE memberships past their end date to EXPIRED. Access is already cut at check time.
    expiry-cron: "0 */15 * * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
